<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — ANISU TECH ZONE</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
  .modal.open { display: flex; }
</style>
</head>
<body class="bg-gray-100 min-h-screen">

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
    <div class="text-center mb-6">
      <div class="w-16 h-16 gradient-bg rounded-full flex items-center justify-center mx-auto mb-4 text-white font-bold text-2xl">A</div>
      <h1 class="text-2xl font-bold text-gray-800">Admin Login</h1>
      <p class="text-gray-500 text-sm">ANISU TECH ZONE</p>
    </div>
    <form onsubmit="login(event)" class="space-y-4">
      <input type="email" id="loginEmail" required placeholder="Email" class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-purple-500 outline-none">
      <input type="password" id="loginPass" required placeholder="Password" class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-purple-500 outline-none">
      <button type="submit" class="w-full gradient-bg text-white font-bold py-3 rounded-lg">Login</button>
      <p id="loginError" class="text-red-500 text-sm text-center hidden"></p>
    </form>
  </div>
</div>

<!-- ADMIN DASHBOARD -->
<div id="adminPanel" class="hidden">
  <header class="bg-white shadow-md sticky top-0 z-40">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-10 h-10 gradient-bg rounded-lg flex items-center justify-center text-white font-bold text-xl">A</div>
        <h1 class="font-bold text-lg text-gray-800">Admin Panel</h1>
      </div>
      <div class="flex items-center gap-3">
        <span id="userEmail" class="text-sm text-gray-600 hidden md:inline"></span>
        <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Logout</button>
      </div>
    </div>
  </header>

  <div class="container mx-auto px-4 py-6 max-w-6xl">
    <div class="flex gap-2 mb-6">
      <button onclick="showTab('services')" id="tabServices" class="tab-btn active px-5 py-2 rounded-lg font-semibold bg-purple-600 text-white">Services</button>
      <button onclick="showTab('orders')" id="tabOrders" class="tab-btn px-5 py-2 rounded-lg font-semibold bg-white text-gray-700">Orders</button>
    </div>

    <div id="servicesTab">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold text-gray-800">Manage Services</h2>
        <button onclick="openServiceModal()" class="gradient-bg text-white px-5 py-2 rounded-lg font-semibold">+ Add Service</button>
      </div>
      <div id="servicesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>

    <div id="ordersTab" class="hidden">
      <h2 class="text-2xl font-bold text-gray-800 mb-4">Orders</h2>
      <div id="ordersList" class="space-y-3"></div>
    </div>
  </div>
</div>

<!-- SERVICE MODAL -->
<div id="serviceModal" class="modal">
  <div class="bg-white rounded-2xl p-6 w-full max-w-lg max-h-screen overflow-y-auto">
    <h3 id="modalTitle" class="text-xl font-bold mb-4">Add Service</h3>
    <form onsubmit="saveService(event)" class="space-y-3">
      <input type="hidden" id="serviceId">
      <div class="grid grid-cols-2 gap-3">
        <input type="text" id="sIcon" required placeholder="Icon (💳)" class="px-4 py-2 rounded-lg border-2 border-gray-200 focus:border-purple-500 outline-none">
        <input type="text" id="sPrice" placeholder="Price (Rs. 500+)" class="px-4 py-2 rounded-lg border-2 border-gray-200 focus:border-purple-500 outline-none">
      </div>
      <input type="text" id="sTitle" required placeholder="Service Title" class="w-full px-4 py-2 rounded-lg border-2 border-gray-200 focus:border-purple-500 outline-none">
      <textarea id="sDesc" required placeholder="Description" rows="3" class="w-full px-4 py-2 rounded-lg border-2 border-gray-200 focus:border-purple-500 outline-none"></textarea>
      <div class="grid grid-cols-2 gap-3">
        <select id="sCategory" class="px-4 py-2 rounded-lg border-2 border-gray-200 focus:border-purple-500 outline-none">
          <option value="payments">Payments</option>
          <option value="subscriptions">Subscriptions</option>
          <option value="gaming">Gaming</option>
          <option value="smm">SMM</option>
          <option value="courses">Courses</option>
          <option value="numbers">Numbers</option>
        </select>
        <input type="text" id="sColor" placeholder="border-purple-500" class="px-4 py-2 rounded-lg border-2 border-gray-200 focus:border-purple-500 outline-none">
      </div>
      <input type="number" id="sOrder" placeholder="Order (1, 2, 3...)" class="w-full px-4 py-2 rounded-lg border-2 border-gray-200 focus:border-purple-500 outline-none">
      <div class="flex gap-2 pt-2">
        <button type="submit" class="flex-1 gradient-bg text-white font-bold py-2 rounded-lg">Save</button>
        <button type="button" onclick="closeServiceModal()" class="flex-1 bg-gray-200 text-gray-700 font-bold py-2 rounded-lg">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgJAp0Q2sR0zz6O-zzBzm0D6bOkd1rZvs",
  authDomain: "anisu-tech-zone.firebaseapp.com",
  projectId: "anisu-tech-zone",
  storageBucket: "anisu-tech-zone.firebasestorage.app",
  messagingSenderId: "64067048326",
  appId: "1:64067048326:web:efc7bfc6d352430f425207",
  measurementId: "G-GH1XWQZ598"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.login = async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const pass = document.getElementById('loginPass').value;
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (err) {
    const errEl = document.getElementById('loginError');
    errEl.textContent = '❌ ' + err.message;
    errEl.classList.remove('hidden');
  }
};

window.logout = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
    document.getElementById('userEmail').textContent = user.email;
    loadServices();
    loadOrders();
  } else {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('adminPanel').classList.add('hidden');
  }
});

window.showTab = (tab) => {
  const sTab = document.getElementById('servicesTab');
  const oTab = document.getElementById('ordersTab');
  const sBtn = document.getElementById('tabServices');
  const oBtn = document.getElementById('tabOrders');
  if (tab === 'services') {
    sTab.classList.remove('hidden'); oTab.classList.add('hidden');
    sBtn.className = 'tab-btn active px-5 py-2 rounded-lg font-semibold bg-purple-600 text-white';
    oBtn.className = 'tab-btn px-5 py-2 rounded-lg font-semibold bg-white text-gray-700';
  } else {
    sTab.classList.add('hidden'); oTab.classList.remove('hidden');
    oBtn.className = 'tab-btn active px-5 py-2 rounded-lg font-semibold bg-purple-600 text-white';
    sBtn.className = 'tab-btn px-5 py-2 rounded-lg font-semibold bg-white text-gray-700';
  }
};

let allServices = [];

async function loadServices() {
  const q = query(collection(db, 'Services'), orderBy('order', 'asc'));
  const snap = await getDocs(q);
  allServices = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderServicesList();
}

function renderServicesList() {
  const list = document.getElementById('servicesList');
  list.innerHTML = '';
  if (allServices.length === 0) {
    list.innerHTML = '<p class="text-gray-500 col-span-full text-center py-8">Koi service nahi. "+ Add Service" click karo.</p>';
    return;
  }
  allServices.forEach(s => {
    const card = document.createElement('div');
    card.className = `bg-white p-5 rounded-xl shadow-md border-t-4 ${s.color || 'border-purple-500'}`;
    card.innerHTML = `
      <div class="flex justify-between items-start mb-2">
        <div class="text-3xl">${s.icon}</div>
        <span class="text-xs bg-purple-100 text-purple-700 px-2 py-1 rounded-full">${s.price || 'No price'}</span>
      </div>
      <h3 class="font-bold text-gray-800 mb-1">${s.title}</h3>
      <p class="text-sm text-gray-600 mb-3">${s.desc || ''}</p>
      <div class="flex gap-2">
        <button onclick="editService('${s.id}')" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white text-sm py-2 rounded-lg">✏️ Edit</button>
        <button onclick="deleteService('${s.id}')" class="flex-1 bg-red-500 hover:bg-red-600 text-white text-sm py-2 rounded-lg">🗑️ Delete</button>
      </div>
    `;
    list.appendChild(card);
  });
}

window.openServiceModal = () => {
  document.getElementById('serviceId').value = '';
  document.getElementById('modalTitle').textContent = 'Add Service';
  document.getElementById('sIcon').value = '';
  document.getElementById('sTitle').value = '';
  document.getElementById('sDesc').value = '';
  document.getElementById('sPrice').value = '';
  document.getElementById('sCategory').value = 'payments';
  document.getElementById('sColor').value = '';
  document.getElementById('sOrder').value = '';
  document.getElementById('serviceModal').classList.add('open');
};

window.editService = (id) => {
  const s = allServices.find(x => x.id === id);
  if (!s) return;
  document.getElementById('serviceId').value = id;
  document.getElementById('modalTitle').textContent = 'Edit Service';
  document.getElementById('sIcon').value = s.icon || '';
  document.getElementById('sTitle').value = s.title || '';
  document.getElementById('sDesc').value = s.desc || '';
  document.getElementById('sPrice').value = s.price || '';
  document.getElementById('sCategory').value = s.category || 'payments';
  document.getElementById('sColor').value = s.color || '';
  document.getElementById('sOrder').value = s.order || '';
  document.getElementById('serviceModal').classList.add('open');
};

window.closeServiceModal = () => document.getElementById('serviceModal').classList.remove('open');

window.saveService = async (e) => {
  e.preventDefault();
  const id = document.getElementById('serviceId').value;
  const data = {
    icon: document.getElementById('sIcon').value,
    title: document.getElementById('sTitle').value,
    desc: document.getElementById('sDesc').value,
    price: document.getElementById('sPrice').value,
    category: document.getElementById('sCategory').value,
    color: document.getElementById('sColor').value || 'border-purple-500',
    order: parseInt(document.getElementById('sOrder').value) || 99
  };
  try {
    if (id) {
      await updateDoc(doc(db, 'Services', id), data);
    } else {
      await addDoc(collection(db, 'Services'), data);
    }
    closeServiceModal();
    loadServices();
  } catch (err) {
    alert('Error: ' + err.message);
  }
};

window.deleteService = async (id) => {
  if (!confirm('Pakka delete karna hai?')) return;
  await deleteDoc(doc(db, 'Services', id));
  loadServices();
};

async function loadOrders() {
  try {
    const q = query(collection(db, 'orders'), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    const orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderOrders(orders);
  } catch (err) {
    document.getElementById('ordersList').innerHTML = '<p class="text-gray-500">Orders load nahi ho sake.</p>';
  }
}

function renderOrders(orders) {
  const list = document.getElementById('ordersList');
  list.innerHTML = '';
  if (orders.length === 0) {
    list.innerHTML = '<p class="text-gray-500 text-center py-8">Koi order nahi abhi tak.</p>';
    return;
  }
  orders.forEach(o => {
    const div = document.createElement('div');
    div.className = 'bg-white p-4 rounded-xl shadow-md';
    const statusColor = o.status === 'completed' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700';
    div.innerHTML = `
      <div class="flex justify-between items-start mb-2">
        <div>
          <h3 class="font-bold text-gray-800">${o.name}</h3>
          <p class="text-sm text-gray-600">📱 ${o.phone}</p>
        </div>
        <span class="${statusColor} text-xs px-3 py-1 rounded-full font-semibold">${o.status || 'pending'}</span>
      </div>
      <p class="text-sm text-gray-700 mb-2"><strong>Service:</strong> ${o.service}</p>
      ${o.trxId ? `<p class="text-sm text-gray-700 mb-2"><strong>TRX ID:</strong> ${o.trxId}</p>` : ''}
      ${o.message ? `<p class="text-sm text-gray-600 mb-2">💬 ${o.message}</p>` : ''}
      <div class="flex gap-2 mt-3">
        <a href="https://wa.me/${o.phone.replace(/[^0-9]/g, '')}" target="_blank" class="flex-1 bg-green-500 hover:bg-green-600 text-white text-center text-sm py-2 rounded-lg">📲 WhatsApp</a>
        <button onclick="toggleStatus('${o.id}', '${o.status || 'pending'}')" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white text-sm py-2 rounded-lg">${o.status === 'completed' ? '↩ Pending' : '✓ Complete'}</button>
      </div>
    `;
    list.appendChild(div);
  });
}

window.toggleStatus = async (id, current) => {
  const newStatus = current === 'completed' ? 'pending' : 'completed';
  await updateDoc(doc(db, 'orders', id), { status: newStatus });
  loadOrders();
};
</script>

</body>
</html>
